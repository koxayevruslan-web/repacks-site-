<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main</title>

</head>
<body>
<a href="{{ url_for('discord_page') }}" class="discord-corner-btn" title="My Discord">

    <div class="search-container">
        <input type="text" id="game-search" class="search-input" placeholder="Search games...">
    </div>

    <div class="hover-image-container">
        <img src="{{ url_for('static', filename='GTA5.jpg') }}" alt="GTA 5" class="hover-image img-gta5">
        <img src="{{ url_for('static', filename='RDR2.jpg') }}" alt="RDR 2" class="hover-image img-rdr2">
        <img src="{{ url_for('static', filename='F12020.jpg') }}" alt="F1 2020" class="hover-image img-f12020">
        <img src="{{ url_for('static', filename='TLOU1.jpg') }}" alt="TLOU 1" class="hover-image img-tlou1">
    </div>

    <div class="buttons-container" id="games-list">
        <div class="game-item" data-game="gta5" data-name="gta 5 grand theft auto">
            <div class="blue-line"></div>
            <a href="{{ url_for('gta5') }}" class="game-link">GTA 5</a>
        </div>
        <div class="game-item" data-game="rdr2" data-name="red dead redemption 2 rdr2">
            <div class="blue-line"></div>
            <a href="{{ url_for('rdr2') }}" class="game-link">RED DEAD REDEMPTION 2</a>
        </div>
        <div class="game-item" data-game="f12020" data-name="f1 2020 formula">
            <div class="blue-line"></div>
            <a href="{{ url_for('f12020') }}" class="game-link">F1 2020</a>
        </div>
        <div class="game-item" data-game="tlou1" data-name="the last of us part 1 tlou">
            <div class="blue-line"></div>
            <a href="{{ url_for('tlou1') }}" class="game-link">THE LAST OF US PART 1</a>
        </div>
    </div>

    <div class="intro-container">
        <div class="intro-text" id="typing-text"></div>
    </div>

    <script>
        const searchInput = document.getElementById('game-search');
        const gameItems = document.querySelectorAll('.game-item');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            gameItems.forEach(item => {
                const name = item.getAttribute('data-name');
                if (name.includes(query)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        const texts = [
            "Hey, I'm Ruslan and this is my repack site",
            "Hope I can help you"
        ];

        let textIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const element = document.getElementById("typing-text");

        function type() {
            const currentText = texts[textIndex];
            if (isDeleting) {
                element.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                element.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = 80;
            if (!isDeleting && charIndex === currentText.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % texts.length;
                typeSpeed = 500;
            }
            setTimeout(type, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(type, 500);

            const images = document.querySelectorAll('.hover-image');
            const bgContainer = document.querySelector('.hover-image-container');

            gameItems.forEach(item => {
                const game = item.getAttribute('data-game');
                const img = document.querySelector(`.img-${game}`);

                item.addEventListener('mouseenter', () => {
                    images.forEach(im => im.classList.remove('active'));
                    if (img) img.classList.add('active');
                    if (bgContainer) bgContainer.classList.add('active-bg');
                });

                item.addEventListener('mouseleave', () => {
                    if (img) img.classList.remove('active');
                    if (bgContainer) bgContainer.classList.remove('active-bg');
                });
            });
        });
    </script>
<script>
    function copyEmail() {
        navigator.clipboard.writeText('koxayevruslan@gmail.com');
        
        const tooltip = document.getElementById('copiedTooltip');
        tooltip.classList.add('show');
        
        setTimeout(() => {
            tooltip.classList.remove('show');
        }, 1200);
    }
</script>
</body>
</html>
